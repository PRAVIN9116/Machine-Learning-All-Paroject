<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>WeatherWise - Weather Forecasting</h1>
        <form id="weather-form">
            <label for="temp_min">Min Temperature (°C):</label>
            <input type="number" id="temp_min" name="temp_min" step="0.1" required>

            <label for="temp_max">Max Temperature (°C):</label>
            <input type="number" id="temp_max" name="temp_max" step="0.1" required>

            <label for="precipitation">Precipitation (mm):</label>
            <input type="number" id="precipitation" name="precipitation" step="0.1" required>

            <label for="wind">Wind Speed (m/s):</label>
            <input type="number" id="wind" name="wind" step="0.1" required>

            <label for="month">Month (1-12):</label>
            <input type="number" id="month" name="month" min="1" max="12" required>

            <label for="day">Day (1-31):</label>
            <input type="number" id="day" name="day" min="1" max="31" required>

            <button type="submit">Predict Weather</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
